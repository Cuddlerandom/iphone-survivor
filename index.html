<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>iPhone Survivor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui" class="hidden">
    <div id="score">Score: 0</div>
    <div id="level">Level: 1</div>
    <div id="highscore">Best: 0</div>
    <div id="healthBar"><div id="healthFill"></div></div>
    <div id="xpBar"><div id="xpFill"></div></div>
    <div id="xpText">XP: 0 / 40</div>
  </div>
  <button id="pauseBtn" class="hidden">⏸</button>
  <div id="weaponSelect">
    <h2>Wähle deine Startwaffe</h2>
    <button class="weaponBtn" data-weapon="pistole">Pistole<br><small>Präzise, Single-Target</small></button>
    <button class="weaponBtn" data-weapon="shotgun">Shotgun<br><small>Spread, Nahbereich</small></button>
    <button class="weaponBtn" data-weapon="katana">Katana<br><small>Melee-Slash, sehr nah</small></button>
  </div>
  <div id="levelUpModal" class="hidden">
    <h2>Level Up!</h2>
    <div id="upgrades"></div>
  </div>
  <div id="chestModal" class="hidden">
    <h2>🎁 Boss-Truhe!</h2>
    <p>Du erhältst <span id="chestCount"></span> Upgrades:</p>
    <div id="chestRewards"></div>
    <button id="chestCloseBtn">Weiter</button>
  </div>
  <div id="pauseMenu" class="hidden">
    <h2>Pause</h2>
    <button id="resumeBtn">Weiter</button>
    <button id="restartFromPauseBtn">Neu starten</button>
  </div>
  <div id="gameOver" class="hidden">
    <h2>Game Over</h2>
    <p>Score: <span id="finalScore"></span></p>
    <p id="newHighscore" class="hidden">Neuer Highscore!</p>
    <p>Best: <span id="bestScoreDisplay"></span></p>
    <button id="restartBtn">Neu starten</button>
  </div>
  <div id="iphoneOnly" class="hidden">
    <p>Dieses Spiel ist ausschließlich für iPhone optimiert.</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
